name: CI

# Every push to main and every pull request: the unit and packaging tests,
# the Firefox build checked by Mozilla's own add-on linter (the check
# addons.mozilla.org runs on upload) and the audit of the development tools.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The extension and the npm package have no dependencies; everything npm
      # installs here is a build tool. deepmerge (through addons-linter) has a
      # low advisory with no fixed release, so the gate is moderate and above.
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Tests
        run: npm test
      # Builds dist/chrome, dist/firefox and the npm tarball, then lints the
      # Firefox build exactly as it would be uploaded.
      - name: Build and add-on linter
        run: npm run lint
